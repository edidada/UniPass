name: Gradle JDK 17

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install local test Redis
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server
          redis-server --version
      - name: Compile, package and run all unit and integration tests
        run: ./gradlew --no-daemon clean build -PtestRedisExecutable=/usr/bin/redis-server
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-jdk17-test-reports
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
          retention-days: 7
