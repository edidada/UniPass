name: Maven JDK 17

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install local test Redis
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server
          redis-server --version
      - name: Compile, package and run all unit and integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify -Pintegration -Dtest.redis.executable=/usr/bin/redis-server
      # The frontend chain (npm ci -> vue-tsc -> vitest -> vite build) runs inside the iam-portal
      # reactor prior to iam-server, so package success already proves the Vue/TypeScript gates.
      - name: Start iam-web and verify health
        env:
          UNIPASS_RP_ID: crm
          UNIPASS_RP_ISSUER: http://localhost:8080
          UNIPASS_RP_ORIGIN: http://localhost:8081
          UNIPASS_RP_CLIENT_SECRET: test-only-rp-secret-0123456789abcdef
          UNIPASS_RP_SESSION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          UNIPASS_RP_REDIS_HOST: 127.0.0.1
          UNIPASS_RP_REDIS_PORT: "6380"
          UNIPASS_RP_REDIS_PASSWORD: test-only-redis
          UNIPASS_RP_PORT: "8081"
        run: |
          redis-server --port 6380 --bind 127.0.0.1 --requirepass "$UNIPASS_RP_REDIS_PASSWORD" --save "" --appendonly no --daemonize yes
          java -jar iam-web/target/iam-web-0.1.0-SNAPSHOT-exec.jar --server.address=127.0.0.1 --unipass.rp.local-http=true > /tmp/iam-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health; then
              exit 0
            fi
            sleep 2
          done
          echo "iam-web failed to become healthy"
          cat /tmp/iam-web.log
          exit 1
      - name: Verify packaged portal assets and module dependency
        run: |
          EXEC_JAR=iam-server/target/iam-server-0.1.0-SNAPSHOT-exec.jar
          PORTAL_JAR=iam-portal/target/iam-portal-0.1.0-SNAPSHOT.jar
          LIST=$(mktemp)
          trap 'rm -f "$LIST"' EXIT
          test -f "$EXEC_JAR"
          jar tf "$EXEC_JAR" > "$LIST"
          test "$(grep -cF 'BOOT-INF/lib/iam-portal-0.1.0-SNAPSHOT.jar' "$LIST")" -eq 1
          jar tf "$PORTAL_JAR" > "$LIST"
          grep -Fq 'META-INF/resources/portal/index.html' "$LIST"
          test "$(grep -cE '^META-INF/resources/portal/assets/[A-Za-z0-9._-]+\.js$' "$LIST")" -ge 1
          test "$(grep -cE '^META-INF/resources/portal/assets/[A-Za-z0-9._-]+\.css$' "$LIST")" -ge 1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-jdk17-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
            **/target/failsafe-reports/*.xml
            **/target/failsafe-reports/*.txt
            **/target/frontend-test-results.xml
          if-no-files-found: warn
          retention-days: 7
