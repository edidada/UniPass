logging:
  level:
    org.eclipse.angus.mail: WARN
    jakarta.mail: WARN
spring:
  application:
    name: unipass-iam
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${UNIPASS_DB_URL}
    username: ${UNIPASS_DB_USER}
    password: ${UNIPASS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 3000
  data:
    redis:
      host: ${UNIPASS_REDIS_HOST:127.0.0.1}
      port: ${UNIPASS_REDIS_PORT:6379}
      password: ${UNIPASS_REDIS_PASSWORD}
      ssl:
        enabled: ${UNIPASS_REDIS_TLS:false}
      connect-timeout: 500ms
      timeout: 500ms
  session:
    timeout: 8h
    redis:
      namespace: ${UNIPASS_SESSION_NAMESPACE:unipass:session}
      repository-type: indexed
      configure-action: none
server:
  port: ${UNIPASS_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        name: UNIPASS_SSO
        http-only: true
        secure: true
        same-site: lax
        path: /
unipass:
  feishu:
    enabled: ${UNIPASS_FEISHU_ENABLED:false}
  security:
    generation-key: ${UNIPASS_REDIS_GENERATION_KEY:unipass:security:generation}
  audit:
    trusted-proxies: ${UNIPASS_AUDIT_TRUSTED_PROXIES:}
    retention: ${UNIPASS_AUDIT_RETENTION:P180D}
    archive:
      enabled: ${UNIPASS_AUDIT_ARCHIVE_ENABLED:false}
      interval: ${UNIPASS_AUDIT_ARCHIVE_INTERVAL:PT30M}
      initial-delay: ${UNIPASS_AUDIT_ARCHIVE_INITIAL_DELAY:PT1M}
  recovery:
    email:
      enabled: ${UNIPASS_RECOVERY_EMAIL_ENABLED:false}
  mfa:
    key: ${UNIPASS_MFA_KEY:}
    keys-json: ${UNIPASS_MFA_KEYS_JSON:}
  issuer: ${UNIPASS_ISSUER}
  signing:
    store: ${UNIPASS_SIGNING_STORE}
    password: ${UNIPASS_SIGNING_PASSWORD}
    alias: ${UNIPASS_SIGNING_ALIAS}
  password:
    history-verified: ${UNIPASS_PASSWORD_HISTORY_VERIFIED:false}
    reset-history-verified: ${UNIPASS_RESET_HISTORY_VERIFIED:false}
